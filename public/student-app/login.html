<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - تطبيق الطالب</title>
  <link rel="stylesheet" href="/student/css/student.css">
</head>
<body>
  <main class="student-auth-wrap">
    <section class="student-auth-card">
      <h1>تسجيل الدخول</h1>
      <p class="student-subtitle">ادخل ببيانات حساب الطالب.</p>
      <div id="authError" class="student-error-box" hidden></div>
      <form id="loginForm" class="student-form" novalidate>
        <label class="student-form-row">
          <span>اسم المستخدم</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label class="student-form-row">
          <span>كلمة المرور</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button id="loginSubmit" type="submit" class="student-btn student-btn-primary">دخول</button>
      </form>
      <p class="student-auth-footer">
        لا تملك حسابًا؟
        <a class="student-link" href="/student/register.html">إنشاء حساب جديد</a>
      </p>
    </section>
  </main>
  <script type="module" src="/student/js/login.js"></script>
</body>
</html>
